# Originally auto-generated by the Firebase CLI, then extended by hand.
# https://github.com/firebase/firebase-tools
#
# Deliberately does NOT deploy rules. A preview channel serves a candidate build, but Firestore and
# Storage rules are project-wide with no per-channel equivalent — deploying them from a pull request
# would apply unreviewed rules to live data. Rules ship only on merge.

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SVR_GARDEN }}
          projectId: svr-garden
